<div class="w-64 h-full min-h-[89vh] bgNavbar border-gray-200 p-4 flex flex-col gap-2">

  <h2 class="text-lg font-bold mb-4 px-2">Panel Admin</h2>

  <a routerLink="/ShoppingApp/productlist"
    routerLinkActive="bg-green-100 text-green-700"
    [routerLinkActiveOptions]="{ exact: true }"
    class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-100 transition-colors">
    <i class="pi pi-box"></i>
    <span>Administrar productos</span>

  </a>

  @if (esAdmin()) {
    <a
      routerLink="/ShoppingApp/productlist/usuarios"
      routerLinkActive="bg-green-100 text-green-700"
      class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-100 transition-colors">
      <i class="pi pi-users"></i>
      <span>Administrar usuarios</span>
    </a>
  }
</div>
